<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B5D52" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<title>Pathfinder Field Evidence Logger</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" hidden aria-label="Back to home">←</button>
    <h1 id="screen-title">Pathfinder Field Evidence Logger</h1>
  </header>

  <main id="app">
    <section id="view-home" class="view" aria-label="Home"></section>
    <section id="view-form" class="view" hidden aria-label="Entry form"></section>
    <section id="view-saved" class="view" hidden aria-label="Saved entries"></section>
    <section id="view-export" class="view" hidden aria-label="Export"></section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/constants.js"></script>
  <script src="js/db.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
